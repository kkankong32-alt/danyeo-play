<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다녀오겠습니다</title><link rel="stylesheet" href="style.css?v=16">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-DC7N6KQBG0"></script>
<script>

<header><strong>다녀오겠습니다</strong><span id="chapter">사진을 꺼내는 중…</span><button id="fullscreen">전체화면</button><button id="menuBtn">메뉴</button></header>
<div class="stage"><canvas id="view" width="1920" height="1080" tabindex="0" aria-label="이동하며 이야기하는 게임 화면"></canvas><div id="loading">오래된 사진 속으로…</div></div>
<div id="journeyHint" aria-live="polite"></div><div id="actionHint" role="status"></div><footer><span>방향키 / WASD · 이동　 E / Space · 이야기　 바닥 클릭 · 걷기</span><button id="actBtn">E · 행동</button><span id="saveNote" aria-live="polite"></span></footer>
<p id="transcript" class="sr-only" aria-live="polite"></p>
<dialog id="menu"><p class="eyebrow">엄마와 아빠도 일곱 살이었다</p><h1>다녀오겠습니다</h1><p>사진 속에서 만난 일곱 살의 엄마와 아빠.</p><button id="continue">이어서 하기</button><button id="new">직접 플레이 · 처음부터</button><button id="watch">이야기 감상하기</button><button id="restartWatch" hidden>감상 처음부터 다시 보기</button><button id="sound">소리 켜짐</button><p id="musicNow" class="small" aria-live="polite"></p><button id="closeMenu">게임으로</button><p class="small">음악은 첫 클릭 뒤 재생됩니다.<br>자동 저장 · 같은 브라우저에서 이어 할 수 있어요.<br>대화·연출 중에는 직전 안전한 지점에서 이어집니다.</p></dialog>
<section id="developer" hidden><h2>개발자 검수</h2><button id="exportLog">플레이 기록 표시</button><textarea id="audit" aria-label="플레이 기록" rows="10"></textarea><p id="debugState"></p></section>
</main><script type="module" src="src/main.js?v=16"></script></body></html>
